<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centre Geks Officiel - ReNova</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="logo-box">R·N</div>
      <nav class="nav-links">
        <a class="nav-link active">Dashboard</a>
        <a class="nav-link">Utilisateurs</a>
        <a class="nav-link">Validations</a>
      </nav>
      <div class="topbar-right">
        <span class="super-badge">⭐ Super Admin</span>
        <div class="user-chip">
          <div class="avatar-sm">A</div>
          Accès Control
        </div>
      </div>
    </div>

    <div class="page">
      <div class="hero">
        <div class="backoffice-tag">Back Office</div>
        <h1>Centre de<br />commande <span class="renova">ReNova</span></h1>
        <p class="hero-desc">
          Architecture, validations, finances et logistique tous sur un seul
          écran.
        </p>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-top">
            <span class="stat-lbl">Utilisateurs</span
            ><span class="pill pill-green">En direct</span>
          </div>
          <div class="stat-num">API Go</div>
          <div class="stat-sub-lbl">Connectée</div>
          <div
            class="stat-underline"
            style="background: var(--gold); width: 55%"
          ></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-head">
          <div class="sec-title">
            <div class="sec-icon si-b">👥</div>
            Gestion des Utilisateurs
          </div>
          <div class="sec-actions">
            <span class="cnt-badge">... comptes</span>
            <button
              class="btn-primary"
              style="font-size: 10px; padding: 5px 11px"
              onclick="
                document.getElementById('add-user-panel').style.display = 'flex'
              "
            >
              + Créer un compte
            </button>
          </div>
        </div>

        <div
          id="add-user-panel"
          style="
            display: none;
            gap: 10px;
            padding: 15px 32px;
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border);
            align-items: center;
          "
        >
          <form id="form-add-user" style="display: flex; gap: 8px; width: 100%">
            <input
              type="text"
              id="add-prenom"
              placeholder="Prénom"
              class="search-box"
              required
            />
            <input
              type="text"
              id="add-nom"
              placeholder="Nom"
              class="search-box"
              required
            />
            <input
              type="email"
              id="add-email"
              placeholder="Email"
              class="search-box"
              required
            />
            <input
              type="password"
              id="add-mdp"
              placeholder="Mot de passe"
              class="search-box"
              required
            />
            <select id="add-role" class="search-box" style="width: auto">
              <option value="Utilisateur">Utilisateur</option>
              <option value="Prestataire">Prestataire</option>
              <option value="Admin">Admin</option>
            </select>
            <button
              type="submit"
              class="btn-primary"
              onclick="CreateUser()"
              style="padding: 5px 15px"
            >
              Valider
            </button>
            <button
              type="button"
              class="btn-secondary"
              style="padding: 5px 15px"
              onclick="
                document.getElementById('add-user-panel').style.display = 'none'
              "
            >
              Annuler
            </button>
          </form>
        </div>

        <div class="users-bar">
          <input
            class="search-box"
            type="text"
            placeholder="Rechercher un utilisateur"
          />
          <button class="flt-btn on">Tous rôles ▾</button>
        </div>

        <div class="users-split">
          <div class="users-table" id="users-container"></div>
        </div>
      </div>
    </div>

    <!-- // FORM DE MODIFICATION D'UN UTILISATEUR -->
<div id="edit-user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Modifier l'utilisateur</h3>
            <span class="close-btn" onclick="CloseEditModal()">&times;</span>
        </div>
        
        <form id="edit-user-form">
            <input type="hidden" id="edit-id">

            <div class="form-group">
                <label for="edit-nom">Nom</label>
                <input type="text" id="edit-nom" required>
            </div>

            <div class="form-group">
                <label for="edit-prenom">Prénom</label>
                <input type="text" id="edit-prenom" required>
            </div>

            <div class="form-group">
                <label for="edit-email">Email</label>
                <input type="email" id="edit-email" required>
            </div>

            <div class="form-group">
                <label for="edit-role">Rôle</label>
                <select id="edit-role">
                    <option value="Utilisateur">Utilisateur</option>
                    <option value="Prestataire">Prestataire</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="CloseEditModal()">Annuler</button>
                <button type="submit" class="btn-submit" onclick="UpdateUser(document.getElementById('edit-id').value)">Enregistrer les modifications</button>
            </div>


    <script src="renova.js"></script>
  </body>
</html>
