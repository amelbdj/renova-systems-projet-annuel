events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Upload d'images d'annonces (le backend accepte jusqu'a 30 Mo)
    client_max_body_size 30M;

    # Necessaire pour le proxy WebSocket (messagerie /ws/chat)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index landing.html;

        # ---- API + backend : tout ce qui commence par /api/ ----
        # Exemple : http://IP/api/admin/login  ->  backend  /admin/login
        #           http://IP/api/annonces/all ->  backend  /api/annonces/all
        #           http://IP/api/ws/chat      ->  backend  /ws/chat (WebSocket)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8081;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ---- Fichiers uploades (images annonces/articles, PDF) ----
        # Accessibles directement : http://HOST/uploads/annonces/xxx.png
        location /uploads/ {
            proxy_pass http://backend:8081/uploads/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 15M;
        }

        # ---- Compat WAMP : des pages referencent leurs assets via ../Frontend/... ----
        # En Docker la racine EST le dossier Frontend, donc /Frontend/xxx pointe
        # vers la racine. Cet alias evite de modifier tous les fichiers HTML.
        location /Frontend/ {
            alias /usr/share/nginx/html/;
        }

        # ---- URLs propres (clean URLs) -> fichiers .html ----
        # Les query strings (?id=...) sont transmis automatiquement.
        location = /login              { try_files /login.html =404; }
        location = /register           { try_files /register.html =404; }
        location = /reset-password     { try_files /reset-password.html =404; }
        location = /swagger            { try_files /swagger.html =404; }
        location = /a-propos           { try_files /a-propos.html =404; }
        location = /simulateur         { try_files /simulateur.html =404; }
        location = /annonces           { try_files /annonceAll.html =404; }
        location = /annonce            { try_files /oneAnnonce.html =404; }
        location = /evenements         { try_files /evenement.html =404; }
        location = /article            { try_files /article.html =404; }
        location = /profil             { try_files /profil.html =404; }
        location = /forum              { try_files /forum.html =404; }
        location = /client             { try_files /espClient.html =404; }
        location = /pro                { try_files /espPro.html =404; }
        location = /admin              { try_files /admin_dashboard.html =404; }
        location = /admin/users        { try_files /admin_users.html =404; }
        location = /admin/validations  { try_files /admin_validations.html =404; }
        location = /admin/finances     { try_files /admin_finances.html =404; }
        location = /admin/documents    { try_files /admin_documents.html =404; }
        location = /admin/conteneurs   { try_files /admin_conteneurs.html =404; }
        location = /salarie            { try_files /salarie/salarie_dashboard.html =404; }
        location = /salarie/forum      { try_files /salarie/salarie_forum.html =404; }
        location = /salarie/planning   { try_files /salarie/salarie_planning.html =404; }
        location = /salarie/content    { try_files /salarie/salarie_content.html =404; }
        location = /salarie/evenements { try_files /salarie/salarie_events.html =404; }

        # ---- Site statique (pages, JS, CSS, images) ----
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
