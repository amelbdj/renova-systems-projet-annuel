<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Frontend/style/client.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <title>Articles</title>
  </head>
  <body>
    
    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <nav class="topnav">
      <div class="nav-logo">
        <img src="../Frontend/assets/logo renova.png" alt="UpcycleConnect" />
      </div>
      <div class="nav-links">
        <a class="nav-link active" data-i18n="landing.nav.home">Accueil</a>
        <a class="nav-link" href="../Frontend/espClient.html" data-i18n="annonce.nav.listings">Annonces</a>
        <a class="nav-link" href="../Frontend/espClient.html" data-i18n="forum.nav.containers">Conteneurs</a>
        <a class="nav-link" href="../Frontend/espClient.html" data-i18n="forum.nav.catalog">Catalogue</a>
        <a class="nav-link" href="../Frontend/espClient.html" data-i18n="forum.nav.planning">Planning</a>
        <a class="nav-link" href="../Frontend/espClient.html" data-i18n="forum.nav.score">Mon score</a>
        <a class="nav-link" href="../Frontend/article.html" data-i18n="forum.nav.article">Article</a>
        <a class="nav-link" href="../Frontend/evenement.html" data-i18n="forum.nav.event">Evenement</a>
        <a class="nav-link" href="../Frontend/forum.html" data-i18n="forum.nav.forum">Forum</a>
      </div>
      <div class="nav-right">
        <button class="nav-link" onclick="showSection('messages-section')">
          <i class="fas fa-envelope"></i> <span data-i18n="forum.nav.messages">Mes Messages</span>
        </button>
        <div class="nav-icon" onclick="logout()">
          <span class="material-symbols-outlined"> logout </span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined"> notifications </span>
          <div class="notif-dot"></div>
        </div>
        <div
          class="profile-btn"
          onclick="goToProfile()"
          style="cursor: pointer"
        >
          <div class="profile-ava">👤</div>
          <div>
            <div class="profile-name" id="navName">Your Name</div>
            <div class="profile-role" data-i18n="register.role.individual">Particulier</div>
          </div>
        </div>
      </div>
    </nav>

    <div id="articles-section" class="dashboard-section">
      <div class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Rechercher un article, un événement..."
          data-i18n-placeholder="article.search_ph"
        />
        <button type="button" class="btn" onclick="LancerRecherche()">
          <span class="material-symbols-outlined"> search </span>
        </button>
      </div>
      <h2 data-i18n="article.heading">Nos Actualités & Astuces</h2>
      <div id="liste-articles" class="articles-grid"></div>
    </div>

    <section
      id="messages-section"
      class="dashboard-section"
      style="display: none; padding: 20px"
    >
      <div class="section-header" style="margin-bottom: 25px">
        <h2 data-i18n="forum.my_conversations">Mes Conversations</h2>
      </div>
      <div id="conversations-list" style="display: grid; gap: 15px">
        <div class="loading-msg" data-i18n="forum.loading_short">Chargement...</div>
      </div>
      <div id="no-messages" style="display: none; text-align: center">
        <p data-i18n="article.no_messages">Aucun message pour le moment.</p>
      </div>
    </section>

    <div id="articleModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <span class="close-btn" onclick="FermerArticle()">&times;</span>
        <img
          id="modalImage"
          src=""
          alt="Couverture"
          style="
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
          "
        />
        <div style="padding: 20px">
          <h2 id="modalTitre"></h2>
          <p id="modalMeta"></p>
          <div id="modalContenu"></div>
        </div>
      </div>
    </div>

    <div
      id="chatModal"
      class="modal-overlay"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      "
    >
      <div
        class="modal-content"
        style="
          width: 100%;
          max-width: 400px;
          height: 500px;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            padding: 15px;
            background: var(--bg2);
            display: flex;
            justify-content: space-between;
          "
        >
          <h3 data-i18n="forum.discussion">Discussion</h3>
          <span onclick="closeChat()" style="cursor: pointer">&times;</span>
        </div>
        <div
          id="chat-messages"
          style="flex: 1; overflow-y: auto; padding: 15px"
        ></div>
        <div style="padding: 15px; display: flex; gap: 10px">
          <input type="text" id="chat-input" placeholder="Écrivez..." data-i18n-placeholder="article.chat_ph" />
          <button onclick="sendChatMessage()" data-i18n="forum.send">Envoyer</button>
        </div>
      </div>
    </div>
  </body>
  
  <script src="./script/config.js"></script>
  <script src="../Frontend/script/admin/translate.js" defer></script>
  <script src="../Frontend/script/affichageArt.js" defer></script>
  <script src="../Frontend/script/profil.js" defer></script>
  <script src="../Frontend/script/affichageEvt.js" defer></script>
  <script src="../Frontend/script/messagerie/messagerie.js"></script>
</html>
