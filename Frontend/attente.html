<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/attente.css" />
    <title>Validation en attente</title>
  </head>
  <body>
    
    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:1000; display:flex; gap:6px;"></div>

    <div class="container">
      <div class="spinner"></div>
      <h1 data-i18n="attente.title">Validation en attente</h1>
      <p data-i18n="attente.desc">
        Votre compte est actuellement en cours de validation. Vous recevrez un
        email dès que le processus sera terminé. Merci de votre patience.
      </p>
      <button class="btn" onclick="window.location.href = 'landing.html'" data-i18n="attente.back_home">
        Retour à l'accueil
      </button>
    </div>

    
    <script src="./script/admin/translate.js"></script>
  </body>
</html>
