<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Frontend/style/client.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <title>Evenement</title>
    <link rel="icon" type="image/x-icon" href="../Frontend/assets/logoUpcycle.ico" />
  </head>
  <body>
    
    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <nav class="topnav">
      <div class="nav-logo">
        <img src="../Frontend/assets/logo renova.png" alt="UpcycleConnect" />
      </div>
      <div class="nav-links">
        <a class="nav-link active" data-i18n="landing.nav.home">Accueil</a>
        <a class="nav-link" href="/client" data-i18n="annonce.nav.listings">Annonces</a>
        <a class="nav-link" href="/client" data-i18n="forum.nav.containers">Conteneurs</a>
        <a class="nav-link" href="/client" data-i18n="forum.nav.catalog">Catalogue</a>
        <a class="nav-link" href="/client" data-i18n="forum.nav.planning">Planning</a>
        <a class="nav-link" href="/client" data-i18n="forum.nav.score">Mon score</a>
        <a class="nav-link" href="/article" data-i18n="forum.nav.article">Article</a>
        <a class="nav-link" href="/evenements" data-i18n="forum.nav.event">Evenement</a>
        <a class="nav-link" href="/forum" data-i18n="forum.nav.forum">Forum</a>
      </div>
      <div class="nav-right">
        <button class="nav-link" onclick="showSection('messages-section')">
          <i class="fas fa-envelope"></i> <span data-i18n="forum.nav.messages">Mes Messages</span>
        </button>
        <div class="nav-icon">
          <span class="material-symbols-outlined" onclick="logout()">
            logout
          </span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined"> notifications </span>
          <div class="notif-dot"></div>
        </div>
        <div
          class="profile-btn"
          onclick="goToProfile()"
          style="cursor: pointer"
        >
          <div class="profile-ava">👤</div>
          <div>
            <div class="profile-name" id="navName">Your Name</div>
            <div class="profile-role" data-i18n="register.role.individual">Particulier</div>
          </div>
        </div>
      </div>
    </nav>
    <div id="evenements-section" class="dashboard-section">
      <div class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Rechercher un événement..."
          data-i18n-placeholder="evenement.search_ph"
        />
        <button type="button" class="btn" onclick="LancerRecherche()">
          <span class="material-symbols-outlined"> search </span>
        </button>
      </div>

      <h2 data-i18n="evenement.heading">Nos Événements</h2>
      <div id="liste-evenements" class="articles-grid"></div>
    </div>

    <section
      id="messages-section"
      class="dashboard-section"
      style="display: none; padding: 20px"
    >
      <div class="section-header" style="margin-bottom: 25px">
        <h2
          style="font-family: &quot;Syne&quot;, sans-serif; color: var(--txt)"
        >
          <span data-i18n="forum.my_conversations">Mes Conversations</span>
        </h2>
        <p style="color: var(--txt-m)" data-i18n="evenement.conv_sub">Retrouvez ici tous vos échanges.</p>
      </div>

      <div
        id="conversations-list"
        style="
          display: grid;
          gap: 15px;
          grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        "
      >
        <div class="loading-msg" style="color: var(--txt-m)" data-i18n="forum.loading_short">Chargement...</div>
      </div>

      <div
        id="no-messages"
        style="
          display: none;
          text-align: center;
          padding: 50px;
          background: var(--bg2);
          border-radius: 12px;
          border: 1px solid var(--b0);
        "
      >
        <i
          class="fas fa-comments"
          style="font-size: 3rem; color: var(--b0); margin-bottom: 15px"
        ></i>
        <p style="color: var(--txt-m)" data-i18n="article.no_messages">Aucun message pour le moment.</p>
      </div>
    </section>

    <div id="articleModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <span class="close-btn" onclick="FermerEvenement()">&times;</span>
        <img
          id="modalImage"
          src=""
          alt="Couverture"
          style="
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px 8px 0 0;
          "
        />

        <div style="padding: 20px">
          <h2 id="modalTitre" style="margin-top: 0; color: var(--blue)"></h2>
          <p
            id="modalMeta"
            style="color: var(--txt-m); font-size: 13px; margin-bottom: 20px"
          ></p>
          <div
            id="modalContenu"
            style="line-height: 1.6; color: var(--txt)"
          ></div>
        </div>
      </div>
    </div>
    <div
      id="chatModal"
      class="modal-overlay"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      "
    >
      <div
        class="modal-content"
        style="
          width: 100%;
          max-width: 400px;
          height: 500px;
          display: flex;
          flex-direction: column;
          background: var(--bg);
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        "
      >
        <div
          style="
            padding: 15px;
            background: var(--bg2);
            border-bottom: 1px solid var(--b0);
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h3 style="margin: 0; color: var(--txt); font-size: 16px" data-i18n="forum.discussion">
            Discussion
          </h3>
          <span
            class="close-btn"
            onclick="closeChat()"
            style="cursor: pointer; font-size: 20px; color: var(--txt-m)"
            >&times;</span
          >
        </div>

        <div
          id="chat-messages"
          style="
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg);
          "
        ></div>

        <div
          style="
            padding: 15px;
            background: var(--bg2);
            border-top: 1px solid var(--b0);
            display: flex;
            gap: 10px;
          "
        >
          <input
            type="text"
            id="chat-input"
            placeholder="Écrivez un message..."
            data-i18n-placeholder="evenement.chat_ph"
            style="
              flex: 1;
              padding: 10px;
              border-radius: 8px;
              border: 1px solid var(--b0);
              background: var(--bg);
              color: var(--txt);
              outline: none;
            "
          />
          <button
            onclick="sendChatMessage()"
            style="
              background: var(--blue);
              color: white;
              border: none;
              padding: 0 15px;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
            "
          >
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </body>

  
  <script src="./script/config.js"></script>
<script src="./script/notifCloche.js"></script>
<script src="./script/navRole.js"></script>
  <script src="../Frontend/script/admin/translate.js" defer></script>
  <script src="../Frontend/script/profil.js" defer></script>
  <script src="../Frontend/script/affichageEvt.js" defer></script>
  <script src="../Frontend/script/messagerie/messagerie.js?v=4" defer></script>

  <script>
    window.onload = function () {
      
      if (typeof chargerEvenementsClient === "function") {
        chargerEvenementsClient();
      }

      
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("paiement") === "success") {
        alert(
          typeof t === "function"
            ? t("evenement.payment_success")
            : "🎉 Paiement validé ! Vous êtes officiellement inscrit à l'événement.",
        );
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname,
        );
      }
    };
  </script>
</html>
