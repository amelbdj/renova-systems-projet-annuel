<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Planning — ReNova Systems</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <link rel="stylesheet" href="../style/salarie.css" />
  </head>
  <body>
    <nav class="topnav">
      <div class="nav-logo">
        <img src="ton_logo.jpg" alt="ReNova" />
      </div>
      <div class="nav-links">
        <a href="salarie_dashboard.html" class="nav-link">Accueil</a>
        <a href="salarie_events.html" class="nav-link">Événements</a>
        <a href="salarie_planning.html" class="nav-link active">Planning</a>
        <a href="salarie_content.html" class="nav-link">Conseils & News</a>
        <a href="salarie_forum.html" class="nav-link">Modération</a>
      </div>
      <div class="nav-right">
        <div class="lang-btn">
          <span class="material-symbols-outlined">public</span>Lang
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">search</span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined" onclick="logout()"
            >logout</span
          >
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">notifications</span>
          <div class="notif-dot"></div>
        </div>
        <div class="profile-btn" onclick="goToProfile()">
          <div class="profile-ava"></div>
          <div>
            <div class="profile-name"></div>
            <div class="profile-role"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="wrapper">
      <section id="planning" style="padding: 40px 0 52px">
        <div class="sec-label fu">
          <div class="sec-num pink">2</div>
          <div class="sec-title-text">Mon Planning</div>
          <div class="sec-divider"></div>
          <span class="tag t-vi" style="flex-shrink: 0"
            >Semaine du 1 mars 2026</span
          >
          <button
            class="btn btn-v btn-sm"
            style="flex-shrink: 0"
            onclick="openNewSlot()"
          >
            ＋ Ajouter un créneau
          </button>
        </div>
        <div class="planning-layout fu fu1">
          <div class="week-strip">
            <div class="week-header">
              <button id="btn-prev-month" class="btn btn-g btn-xs">←</button>
              <span class="week-month">Mars 2026</span>
              <button id="btn-next-month" class="btn btn-g btn-xs">→</button>
            </div>
            <div class="week-days"></div>
          </div>

          <div class="card">
            <div class="card-hd">
              <div class="card-ht">
                <div class="cht-i" style="background: rgba(240, 106, 170, 0.1)">
                  🗓️
                </div>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap"></div>
            </div>
            <div class="card-bd">
              <div class="timeline"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="../script/salarie/userInfo.js" defer></script>
    <script src="../script/salarie/planning.js" defer></script>
  </body>
</html>
