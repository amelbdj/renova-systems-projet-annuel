<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../script/auth_guard.js"></script>
    <script>
      checkSession("Salari?");
    </script>
    <title>Mon Planning — ReNova Systems</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <link rel="stylesheet" href="../style/salarie.css" />
  </head>
  <body>

    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <nav class="topnav">
      <div class="nav-logo">
        <img src="ton_logo.jpg" alt="ReNova" />
      </div>
      <div class="nav-links">
        <a href="salarie_dashboard.html" class="nav-link" data-i18n="landing.nav.home">Accueil</a>
        <a href="salarie_events.html" class="nav-link" data-i18n="landing.nav.events">Événements</a>
        <a href="salarie_planning.html" class="nav-link active" data-i18n="forum.nav.planning">Planning</a>
        <a href="salarie_content.html" class="nav-link" data-i18n="salarie.nav.content">Conseils & News</a>
        <a href="salarie_forum.html" class="nav-link" data-i18n="salarie.nav.moderation">Modération</a>
      </div>
      <div class="nav-right">
        <div class="lang-btn">
          <span class="material-symbols-outlined">public</span>Lang
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">search</span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined" onclick="logout()"
            >logout</span
          >
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">notifications</span>
          <div class="notif-dot"></div>
        </div>
        <div class="profile-btn" onclick="goToProfile()">
          <div class="profile-ava"></div>
          <div>
            <div class="profile-name"></div>
            <div class="profile-role"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="wrapper">
      <section id="planning" style="padding: 40px 0 52px">
        <div class="sec-label fu">
          <div class="sec-num pink">2</div>
          <div class="sec-title-text" data-i18n="salarie.planning.title">Mon Planning</div>
          <div class="sec-divider"></div>
        </div>
        <div class="card fu fu1">
          <div class="card-hd">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
              "
            >
              <button
                class="btn btn-g btn-xs"
                onclick="changerMois(-1)"
                style="cursor: pointer"
              >
                ← Préc
              </button>
              <span
                id="labelCurrentMonth"
                style="
                  font-family: 'Syne', sans-serif;
                  font-size: 14px;
                  font-weight: 700;
                  color: #fff;
                "
                >Mars 2026</span
              >
              <button
                class="btn btn-g btn-xs"
                onclick="changerMois(1)"
                style="cursor: pointer"
              >
                Suiv →
              </button>
            </div>
          </div>
          <div class="card-bd">
            <div class="cal-grid">
              <div class="cal-dow">Lun</div>
              <div class="cal-dow">Mar</div>
              <div class="cal-dow">Mer</div>
              <div class="cal-dow">Jeu</div>
              <div class="cal-dow">Ven</div>
              <div class="cal-dow">Sam</div>
              <div class="cal-dow">Dim</div>
            </div>
            <div class="ev-list"></div>
          </div>
        </div>
      </section>
    </div>

    <div
      id="detailModal"
      class="modal-bg"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(5px);
        z-index: 9999;
      "
    >
      <div
        class="modal"
        style="
          background: var(--bg2);
          width: 100%;
          max-width: 520px;
          max-height: 85vh;
          overflow-y: auto;
          border-radius: 16px;
          border: 1px solid var(--b0);
          padding: 30px;
          position: relative;
          box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        "
      >
        <span
          onclick="fermerDetailEvent()"
          style="
            position: absolute;
            top: 20px;
            right: 25px;
            cursor: pointer;
            color: var(--txt-m);
            font-size: 20px;
          "
          >✕</span
        >
        <h2
          id="detail-titre"
          style="
            margin-top: 0;
            color: var(--txt);
            font-family: 'Syne', sans-serif;
          "
        ></h2>
        <div
          id="detail-body"
          style="color: var(--txt-m); line-height: 1.6; font-size: 14px"
        ></div>
      </div>
    </div>

    <script src="../script/admin/translate.js" defer></script>
    <script src="../script/config.js"></script>
  <script src="../script/salarie/userInfo.js" defer></script>
    <script src="../script/salarie/planning.js" defer></script>
  </body>
</html>
