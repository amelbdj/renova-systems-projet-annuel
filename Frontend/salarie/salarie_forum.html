<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Frontend/style/salarie.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="../style/salarie.css" />

    <title>Modération du Forum - Espace Salarié</title>
  </head>
  <body>
    <nav class="topnav">
      <div class="nav-logo">
        <img src="ton_logo.jpg" alt="ReNova" />
      </div>
      <div class="nav-links">
        <a href="salarie_dashboard.html" class="nav-link">Accueil</a>
        <a href="salarie_events.html" class="nav-link active">Événements</a>
        <a href="salarie_planning.html" class="nav-link">Planning</a>
        <a href="salarie_content.html" class="nav-link">Conseils & News</a>
        <a href="salarie_forum.html" class="nav-link">Modération</a>
      </div>
      <div class="nav-right">
        <div class="lang-btn">
          <span class="material-symbols-outlined">public</span>Lang
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">search</span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined" onclick="logout()"
            >logout</span
          >
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">notifications</span>
          <div class="notif-dot"></div>
        </div>
        <div class="profile-btn" onclick="goToProfile()">
          <div class="profile-ava"></div>
          <div>
            <div class="profile-name"></div>
            <div class="profile-role"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="wrapper" style="margin-top: 40px; margin-bottom: 60px">
      <div class="card" style="padding: 30px; min-height: 600px">
        <div class="sec-label">
          <div class="sec-num amber">
            <span class="material-symbols-outlined">shield</span>
          </div>
          <div class="sec-title-text">Modération du Forum</div>
          <div class="sec-divider"></div>
        </div>

        <div style="margin-bottom: 20px; display: flex; gap: 10px">
          <button class="btn btn-xs btn-g" onclick="setFilter('all', this)">
            Tous les messages
          </button>
          <button class="btn btn-xs" onclick="setFilter('flag', this)">
            🚩 Signalements uniquement
          </button>
        </div>

        <div class="forum-layout">
          <div class="thread-list" id="forum-thread-list">
            <div class="loading-msg" style="color: var(--txt-m)">
              Chargement des messages...
            </div>
          </div>

          <div class="forum-stats">
            <div class="fstat">
              <div class="fstat-top">
                <div class="fstat-ico">💬</div>
                <div class="fstat-val" id="stat-messages">0</div>
              </div>
              <div class="fstat-lbl">Messages cette semaine</div>
            </div>

            <div class="fstat">
              <div class="fstat-top">
                <div class="fstat-ico">👥</div>
                <div class="fstat-val" id="stat-membres">0</div>
              </div>
              <div class="fstat-lbl">Membres actifs</div>
            </div>

            <div
              class="fstat"
              style="
                border-color: rgba(240, 95, 95, 0.3);
                background: rgba(240, 95, 95, 0.05);
              "
            >
              <div class="fstat-top">
                <div class="fstat-ico">🚩</div>
                <div
                  class="fstat-val"
                  id="stat-signalements"
                  style="color: var(--red)"
                >
                  0
                </div>
              </div>
              <div class="fstat-lbl" style="color: var(--red)">
                Signalements en attente
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../script/salarie/userInfo.js" defer></script>
    <script src="../script/salarie/forum.js" defer></script>
  </body>
</html>
