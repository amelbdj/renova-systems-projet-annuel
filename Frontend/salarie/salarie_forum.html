<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Frontend/style/salarie.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="../style/salarie.css" />

    <script src="../script/auth_guard.js?v=5"></script>
    <script>
      checkSession("Salari?");
    </script>
    <title>Modération du Forum - Espace Salarié</title>
    <link rel="icon" type="image/x-icon" href="../assets/logoUpcycle.ico" />
  </head>
  <body>

    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <nav class="topnav">
      <div class="nav-logo">
        <img src="../assets/logoUpcycle.png" alt="UpcycleConnect" />
      </div>
      <div class="nav-links">
        <a href="/salarie" class="nav-link" data-i18n="landing.nav.home">Accueil</a>
        <a href="/salarie/evenements" class="nav-link active" data-i18n="landing.nav.events">Événements</a>
        <a href="/salarie/planning" class="nav-link" data-i18n="forum.nav.planning">Planning</a>
        <a href="/salarie/content" class="nav-link" data-i18n="salarie.nav.content">Conseils & News</a>
        <a href="/salarie/forum" class="nav-link" data-i18n="salarie.nav.moderation">Modération</a>
      </div>
      <div class="nav-right">
        <div class="nav-icon">
          <span class="material-symbols-outlined" onclick="logout()"
            >logout</span
          >
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined">notifications</span>
          <div class="notif-dot"></div>
        </div>
        <div class="profile-btn" onclick="goToProfile()">
          <div class="profile-ava"></div>
          <div>
            <div class="profile-name"></div>
            <div class="profile-role"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="wrapper" style="margin-top: 40px; margin-bottom: 60px">
      <div class="card" style="padding: 30px; min-height: 600px">
        <div class="sec-label">
          <div class="sec-num amber">
            <span class="material-symbols-outlined">shield</span>
          </div>
          <div class="sec-title-text" data-i18n="salarie.mod.title">Modération du Forum</div>
          <div class="sec-divider"></div>
        </div>

        <div style="margin-bottom: 20px; display: flex; gap: 10px">
          <button class="btn btn-xs btn-g" onclick="setFilter('all', this)" data-i18n="salarie.mod.all_messages">
            Tous les messages
          </button>
          <button class="btn btn-xs" onclick="setFilter('flag', this)" data-i18n="salarie.mod.flags_only">
            🚩 Signalements uniquement
          </button>
        </div>

        <div class="forum-layout">
          <div class="thread-list" id="forum-thread-list">
            <div class="loading-msg" style="color: var(--txt-m)" data-i18n="salarie.mod.loading">
              Chargement des messages...
            </div>
          </div>

          <div class="forum-stats">
            <div class="fstat">
              <div class="fstat-top">
                <div class="fstat-ico">💬</div>
                <div class="fstat-val" id="stat-messages">0</div>
              </div>
              <div class="fstat-lbl" data-i18n="salarie.mod.messages_week">Messages cette semaine</div>
            </div>

            <div class="fstat">
              <div class="fstat-top">
                <div class="fstat-ico">👥</div>
                <div class="fstat-val" id="stat-membres">0</div>
              </div>
              <div class="fstat-lbl" data-i18n="salarie.mod.active_members">Membres actifs</div>
            </div>

            <div
              class="fstat"
              style="
                border-color: rgba(240, 95, 95, 0.3);
                background: rgba(240, 95, 95, 0.05);
              "
            >
              <div class="fstat-top">
                <div class="fstat-ico">🚩</div>
                <div
                  class="fstat-val"
                  id="stat-signalements"
                  style="color: var(--red)"
                >
                  0
                </div>
              </div>
              <div class="fstat-lbl" style="color: var(--red)" data-i18n="salarie.mod.pending_flags">
                Signalements en attente
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script src="../script/admin/translate.js" defer></script>
    <script src="../script/config.js"></script>
  <script src="../script/salarie/userInfo.js" defer></script>
    <script src="../script/salarie/forum.js" defer></script>
  </body>
</html>
