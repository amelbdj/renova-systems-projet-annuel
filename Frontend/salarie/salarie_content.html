<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Salariés — Conseils & News</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="../style/salarie.css" />
  </head>
  <body>
    <nav class="topnav">
      <div class="nav-logo">
        <span class="logo-circle">R</span>
        <div class="logo-text">
          <span class="logo-top">ReNova</span
          ><span class="logo-sub">Systems</span>
        </div>
      </div>
      <div class="nav-links">
        <a href="salarie_dashboard.html" class="nav-link">Vue d'ensemble</a>
        <a href="salarie_events.html" class="nav-link">Événements</a>
        <a href="salarie_planning.html" class="nav-link">Mon Planning</a>
        <a href="salarie_content.html" class="nav-link active"
          >Conseils & News</a
        >
        <a href="salarie_forum.html" class="nav-link">Modération Forum</a>
      </div>
      <div class="nav-right">
        <div class="profile-card">
          <div class="profile-ava">A</div>
          <div class="profile-info">
            <div class="profile-name">Chargement...</div>
            <div class="profile-role">Salarié</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </nav>

    <div class="wrapper">
      <section id="content" class="sec-pane on" style="padding: 40px 0">
        <div class="sec-label fu">
          <div class="sec-num teal">3</div>
          <div class="sec-title-text">Conseils & News</div>
          <div class="sec-divider"></div>
          <button class="btn btn-g" onclick="openNewPost()">
            ＋ Rédiger un article
          </button>
        </div>
        <div class="content-layout fu fu1">
          <div class="content-side">
            <h3 style="margin-bottom: 15px; font-weight: 600">
              En attente de relecture / Brouillons
            </h3>
            <div id="liste-brouillons" class="articles-list"></div>
          </div>
          <div class="content-main">
            <h3 style="margin-bottom: 15px; font-weight: 600">
              Mes publications en ligne
            </h3>
            <div id="liste-publies" class="articles-grid"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="modal-bg" id="postModal">
      <div class="modal shadow">
        <div class="modal-h">
          <div class="modal-t">Nouvel Article</div>
          <button class="modal-close" onclick="closePost()">✕</button>
        </div>
        <div class="modal-b fu fu1" style="gap: 15px">
          <input type="hidden" id="edit-article-id" />
          <div class="form-group">
            <label>Titre de l'article</label>
            <input
              type="text"
              id="post-title"
              placeholder="Ex: Les secrets de la valorisation de composants"
            />
          </div>
          <div class="form-group">
            <label>Catégorie / Mots-clés</label>
            <input
              type="text"
              id="post-type"
              placeholder="Ex: Éco-conception, Tuto, Logistique"
            />
          </div>
          <div class="form-group">
            <label>Contenu de l'article</label>
            <textarea
              id="post-content"
              rows="8"
              placeholder="Écrivez votre article ici... Enregistrez-le en brouillon ou soumettez-le directement à l'administration."
            ></textarea>
          </div>
          <div class="fu" style="gap: 10px; margin-top: 10px">
            <button
              class="btn btn-g"
              style="flex: 1"
              onclick="sauvegarderBrouillon()"
            >
              Enregistrer Brouillon
            </button>
            <button
              class="btn btn-v"
              style="flex: 1"
              onclick="soumettreAValidation()"
            >
              Demander la publication
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../script/salarie/userInfo.js" defer></script>
    <script src="../script/salarie/article.js" defer></script>
  </body>
</html>
