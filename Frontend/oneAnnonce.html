<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annonce — UpcycleConnect Systems</title>
    <link rel="icon" type="image/x-icon" href="../Frontend/assets/logoUpcycle.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/oneAnnonce.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    
    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <nav class="topnav">
      <div class="nav-links">
        <a class="nav-link" href="/annonces" data-i18n="oneAnnonce.back">← Retour aux annonces</a>
      </div>
      <div class="nav-right">
        <div class="nav-ava"><i class="fas fa-user"></i></div>
      </div>
    </nav>

    <div class="breadcrumb">
      <a href="/annonces" data-i18n="oneAnnonce.breadcrumb">Annonce</a>
      <span>›</span>
      <span id="bcCat">—</span>
      <span>›</span>
      <span class="bc-current" id="bcTitle">—</span>
    </div>

    <div id="pageContent"></div>

    <div
      class="not-found"
      id="notFound"
      style="display: none; text-align: center; padding: 80px"
    >
      <div style="font-size: 4rem"><i class="fas fa-search"></i></div>
      <h2 data-i18n="oneAnnonce.not_found_title">Annonce introuvable</h2>
      <p data-i18n="oneAnnonce.not_found_desc">Cette annonce n'existe pas ou le serveur est inaccessible.</p>
      <br />
      <a href="/annonces" style="color: var(--vi-l)"
        ><i class="fas fa-arrow-left"></i> <span data-i18n="oneAnnonce.back_list">Retour à la liste</span></a
      >
    </div>
    <div id="contact-zone" style="margin-top: 20px"></div>
    <div
      id="chatModal"
      class="modal-overlay"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        class="modal-content"
        style="
          background: var(--bg2);
          width: 400px;
          border-radius: 12px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          border: 1px solid var(--b0);
        "
      >
        <div
          style="
            padding: 15px;
            background: var(--bg3);
            border-bottom: 1px solid var(--b0);
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h3 style="margin: 0; font-size: 16px; color: var(--txt)" data-i18n="oneAnnonce.chat_title">
            💬 Discussion
          </h3>
          <button
            onclick="closeChat()"
            style="
              background: none;
              border: none;
              color: var(--txt-m);
              font-size: 20px;
              cursor: pointer;
            "
          >
            &times;
          </button>
        </div>

        <div
          id="chat-messages"
          style="
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg);
          "
        ></div>

        <div
          style="
            padding: 15px;
            background: var(--bg3);
            border-top: 1px solid var(--b0);
            display: flex;
            gap: 10px;
          "
        >
          <input
            type="text"
            id="chat-input"
            placeholder="Écrivez votre message..."
            data-i18n-placeholder="oneAnnonce.chat_ph"
            style="
              flex: 1;
              padding: 10px;
              border-radius: 8px;
              border: 1px solid var(--b0);
              background: var(--bg);
              color: var(--txt);
              outline: none;
            "
          />
          <button onclick="sendChatMessage()" class="btn-chat-send">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    
  <script src="./script/config.js"></script>
    <script src="./script/admin/translate.js"></script>
    <script src="./script/annonces/oneAnnonce.js"></script>
    <script src="./script/messagerie/messagerie.js?v=4"></script>
  </body>
</html>
