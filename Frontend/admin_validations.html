<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Validations — ReNova Admin</title>
    <script src="../Frontend/script/auth_guard.js"></script>
    <script>
      checkSession("Administrateur");
    </script>
    <link rel="stylesheet" href="../Frontend/style/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body
    style="display: flex; min-height: 100vh; margin: 0; background: var(--bg)"
  >
    <aside
      style="
        width: 260px;
        background: var(--bg2);
        border-right: 1px solid var(--b0);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-shrink: 0;
      "
    >
      <div
        style="
          font-family: &quot;Syne&quot;, sans-serif;
          font-size: 24px;
          font-weight: 800;
          color: white;
          text-align: center;
        "
      >
        ReNova <em style="color: var(--or-l); font-style: normal">Admin</em>
      </div>

      <!-- Navigation (En utilisant tes classes .nav-link existantes) -->
      <nav style="display: flex; flex-direction: column; gap: 8px">
        <a
          href="admin_dashboard.html"
          class="nav-link active"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >dashboard</span
          >
          Vue d'ensemble
        </a>
        <a
          href="admin_users.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >group</span
          >
          Utilisateurs
        </a>
        <a
          href="admin_validations.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >check_circle</span
          >
          Validations
          <span
            class="tag t-red"
            style="margin-left: auto; font-size: 10px; padding: 2px 6px"
            >18</span
          >
        </a>
        <a
          href="admin_conteneurs.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >inventory_2</span
          >
          Logistique & Box
        </a>
        <a
          href="admin_finances.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >account_balance</span
          >
          Finances
        </a>
      </nav>
    </aside>

    <main style="flex: 1; padding: 40px">
      <h1 class="hero-title">Centre de <em>Validation</em></h1>

      <div class="vtabs" style="margin: 30px 0">
        <button id="tout" class="vtab on" onclick="setVtab(this, 'all')">
          Tout voir
        </button>
        <button id="ann" class="vtab" onclick="setVtab(this, 'ann')">
          Annonces
        </button>
        <button id="evt" class="vtab" onclick="setVtab(this, 'evt')">
          Événements
        </button>
        <button id="con" class="vtab" onclick="setVtab(this, 'con')">
          Contenus / Articles
        </button>
      </div>

      <div id="result" class="val-grid"></div>
      <div class="modal-bg" id="articleModModal" style="display: none">
        <div class="modal" style="width: 600px; max-width: 90vw">
          <div class="modal-x" onclick="closeArticleModal()">✕</div>

          <div class="modal-h">
            <span class="material-symbols-outlined">article</span>
            <span id="modal-art-title">Chargement du titre...</span>
          </div>

          <div
            class="modal-sub"
            id="modal-art-meta"
            style="margin-bottom: 20px"
          >
            Détails de l'auteur...
          </div>

          <div
            id="modal-art-content"
            style="
              font-size: 15px;
              line-height: 1.7;
              color: var(--txt-m);
              white-space: pre-wrap;
              max-height: 400px;
              overflow-y: auto;
              border: 1px solid var(--b0);
              padding: 15px;
              border-radius: 8px;
              margin-bottom: 25px;
              background: var(--bg2);
            "
          >
            Chargement du contenu...
          </div>

          <div
            style="
              display: flex;
              gap: 12px;
              justify-content: flex-end;
              border-top: 1px solid var(--b1);
              padding-top: 20px;
            "
          >
            <button id="btn-modal-refuser" class="btn btn-red">
              ✕ Refuser
            </button>
            <button id="btn-modal-valider" class="btn btn-g">
              ✓ Valider la publication
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="../Frontend/script/admin/translate.js" defer></script>
    <script src="../Frontend/script/admin/user.js" defer></script>
    <script src="../Frontend/script/admin/annonce.js" defer></script>
    <script src="../Frontend/script/admin/event.js" defer></script>
    <script src="../Frontend/script/admin/articles.js" defer></script>
  </body>
</html>
