<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Validations — UpcycleConnect Admin</title>
    <link rel="icon" type="image/x-icon" href="../Frontend/assets/logoUpcycle.ico" />
    <script src="../Frontend/script/auth_guard.js"></script>
    <script>
      checkSession("Administrateur");
    </script>
    <link rel="stylesheet" href="../Frontend/style/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script>
      if (location.hostname !== "localhost") {
        const scriptOneSignal = document.createElement("script");
        scriptOneSignal.src =
          "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        scriptOneSignal.defer = true;
        document.head.appendChild(scriptOneSignal);
      }
    </script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        if (location.hostname === "localhost") {
          console.log("OneSignal desactive sur localhost");
          return;
        }
        await OneSignal.init({
          appId: "79a53223-420a-46c8-83d9-1ca162fcb64f",
          notifyButton: {
            enable: true,
          },
        });

        const userId = localStorage.getItem("userId");
        if (userId) {
          await OneSignal.login(userId);
          console.log("✅ SUCCÈS : OneSignal est connecté avec l'ID :", userId);
        } else {
          console.log("❌ ERREUR : Aucun userId n'a été trouvé.");
        }
      });
    </script>
      <script src="../Frontend/script/config.js"></script>
</head>
  <body
    style="display: flex; min-height: 100vh; margin: 0; background: var(--bg)"
  >

    <div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:2000; display:flex; gap:6px;"></div>

    <aside
      style="
        width: 260px;
        background: var(--bg2);
        border-right: 1px solid var(--b0);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-shrink: 0;
      "
    >
      <div
        style="
          font-family: &quot;Syne&quot;, sans-serif;
          font-size: 24px;
          font-weight: 800;
          color: white;
          text-align: center;
        "
      >
        <img src="../Frontend/assets/logoUpcycle.png" alt="UpcycleConnect" style="height:44px;display:block;margin:0 auto 10px" />
        <span style="font-size:18px">UpcycleConnect</span><br /><em style="color: var(--or-l); font-style: normal">Admin</em>
      </div>

      <nav style="display: flex; flex-direction: column; gap: 8px">
        <a
          href="admin_dashboard.html"
          class="nav-link active"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >dashboard</span
          >
          <span data-i18n="backoffice.sidebar.overview">Vue d'ensemble</span>
        </a>
        <a
          href="admin_users.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >group</span
          >
          <span data-i18n="backoffice.sidebar.users">Utilisateurs</span>
        </a>
        <a
          href="admin_validations.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >check_circle</span
          >
          <span data-i18n="backoffice.sidebar.validations">Validations</span>
          <span
            class="tag t-red"
            style="margin-left: auto; font-size: 10px; padding: 2px 6px"
            >18</span
          >
        </a>
        <a
          href="admin_conteneurs.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >inventory_2</span
          >
          <span data-i18n="backoffice.sidebar.logistics">Logistique & Box</span>
        </a>
        <a
          href="admin_finances.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >account_balance</span
          >
          <span data-i18n="backoffice.sidebar.finances">Finances</span>
        </a>
        <a
          href="admin_documents.html"
          class="nav-link"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span class="material-symbols-outlined" style="font-size: 20px"
            >description</span
          >
          <span>Documents</span>
        </a>
      </nav>
      <button
        class="btn btn-o btn-full"
        style="margin-top: auto"
        onclick="logout()"
      >
        <span class="material-symbols-outlined" style="font-size: 18px"
          >logout</span
        >
        <span data-i18n="backoffice.sidebar.logout">Déconnexion</span>
      </button>
    </aside>

    <main style="flex: 1; padding: 40px">
      <h1 class="hero-title" data-i18n="backoffice.validations.title">Centre de <em>Validation</em></h1>

      <div class="vtabs" style="margin: 30px 0">
        <button id="tout" class="vtab on" onclick="setVtab(this, 'all')" data-i18n="backoffice.validations.tab_all">
          Tout voir
        </button>
        <button id="ann" class="vtab" onclick="setVtab(this, 'ann')" data-i18n="backoffice.validations.tab_ads">
          Annonces
        </button>
        <button id="evt" class="vtab" onclick="setVtab(this, 'evt')" data-i18n="backoffice.validations.tab_events">
          Événements
        </button>
        <button id="con" class="vtab" onclick="setVtab(this, 'con')" data-i18n="backoffice.validations.tab_content">
          Contenus / Articles
        </button>
      </div>

      <div id="result" class="val-grid"></div>

      <div class="modal-bg" id="articleModModal" style="display: none">
        <div class="modal" style="width: 600px; max-width: 90vw">
          <div class="modal-x" onclick="closeArticleModal()">✕</div>

          <div class="modal-h">
            <span class="material-symbols-outlined">article</span>
            <span id="modal-art-title" data-i18n="backoffice.validations.loading_title">Chargement du titre...</span>
          </div>

          <div
            class="modal-sub"
            id="modal-art-meta"
            style="margin-bottom: 20px"
            data-i18n="backoffice.validations.loading_meta"
          >
            Détails de l'auteur...
          </div>

          <img
            id="modal-art-image"
            src=""
            alt="Couverture de l'article"
            style="
              width: 100%;
              height: 250px;
              object-fit: cover;
              border-radius: 8px;
              margin-bottom: 20px;
              display: none;
            "
          />

          <div
            id="modal-art-content"
            style="
              font-size: 15px;
              line-height: 1.7;
              color: var(--txt-m);
              white-space: pre-wrap;
              max-height: 400px;
              overflow-y: auto;
              border: 1px solid var(--b0);
              padding: 15px;
              border-radius: 8px;
              margin-bottom: 25px;
              background: var(--bg2);
            "
            data-i18n="backoffice.validations.loading_content"
          >
            Chargement du contenu...
          </div>

          <div
            style="
              display: flex;
              gap: 12px;
              justify-content: flex-end;
              border-top: 1px solid var(--b1);
              padding-top: 20px;
            "
          >
            <button id="btn-modal-refuser" class="btn btn-red" data-i18n="backoffice.validations.refuse">
              ✕ Refuser
            </button>
            <button id="btn-modal-valider" class="btn btn-g" data-i18n="backoffice.validations.validate_pub">
              ✓ Valider la publication
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="../Frontend/script/admin/translate.js" defer></script>
    <script src="../Frontend/script/admin/user.js" defer></script>
    <script src="../Frontend/script/admin/annonce.js" defer></script>
    <script src="../Frontend/script/admin/event.js" defer></script>
    <script src="../Frontend/script/admin/articles.js" defer></script>
  </body>
</html>
