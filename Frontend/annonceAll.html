<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annonces </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="./style/annonceAll.css">
</head>
<body>


<div id="wrapper" style="position:fixed; bottom:16px; right:16px; z-index:1000; display:flex; gap:6px;"></div>

<nav class="topnav">
  
  <div class="nav-links">
    <button class="nav-link" onclick="history.back()" data-i18n="annonce.nav.back">← Retour</button>
    <button class="nav-link" data-i18n="landing.nav.home">Accueil</button>
    <button class="nav-link active" data-i18n="annonce.nav.listings">Annonces</button>
    <a class="nav-link" href="./espClient.html" data-i18n="annonce.nav.dashboard">Dashboard</a>
    
  </div>
  <div class="nav-right">
    <a href="./profil.html"><div class="nav-ava"><i class="fas fa-user"></i></div></a>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-text fu">
      <div class="hero-eyebrow" data-i18n="annonce.hero.title">Annonces</div>

      <div class="search-bar">
        <span style="font-size:15px"><i class="fas fa-search"></i></span>
        <input type="text" id="searchInput" placeholder="Rechercher un objet, une catégorie…" data-i18n-placeholder="annonce.search.placeholder" oninput="filterListings()">
        <button class="btn-search" data-i18n="annonce.search.button">Rechercher</button>
      </div>
    </div>
    
  </div>
</div>

<div class="page-body">
  <aside class="sidebar fu">
    <div class="filter-card">
      <div class="filter-title" data-i18n="annonce.filter.category_title">Catégorie</div>
      <div class="filter-opts" id="catFilterOpts">
        <div class="f-opt on" onclick="toggleFilter(this,'cat','all')"><div class="f-opt-left"><span><i class="fa-solid fa-earth-africa"></i></span><span data-i18n="annonce.filter.all_f">Toutes</span></div><div class="f-count" id="catCountAll">0</div></div>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title" data-i18n="annonce.filter.type_title">Type</div>
      <div class="filter-opts">
        <div class="f-opt on"  onclick="toggleFilter(this,'type','all')"><div class="f-opt-left"><span><i class="fa-solid fa-earth-africa"></i></span><span data-i18n="annonce.filter.all_m">Tous</span></div></div>
        <div class="f-opt" onclick="toggleFilter(this,'type','vente')"><div class="f-opt-left"><div class="check-box"></div><span><i class="fa-solid fa-money-bill"></i></span><span data-i18n="annonce.type.sale">Vente</span></div><div class="f-count">12</div></div>
        <div class="f-opt" onclick="toggleFilter(this,'type','don')"><div class="f-opt-left"><div class="check-box"></div><span><i class="fa-solid fa-gift"></i></span><span data-i18n="annonce.type.donation">Don gratuit</span></div><div class="f-count">6</div></div>
      </div>
    </div>
    
    
  </aside>

  <main>
    <div class="sort-bar fu">
      <div class="results-count"><strong id="resultCount">18</strong> <span data-i18n="annonce.results_found">annonces trouvées</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <select class="sort-select" onchange="sortListings(this.value)">
          <option value="recent" data-i18n="annonce.sort.recent">Plus récentes</option>
          <option value="price-asc" data-i18n="annonce.sort.price_asc">Prix croissant</option>
          <option value="price-desc" data-i18n="annonce.sort.price_desc">Prix décroissant</option>
          <option value="alpha" data-i18n="annonce.sort.alpha">A → Z</option>
        </select>
        <div class="view-btns">
          <div class="view-btn on" id="vGrid" onclick="setView('grid')" title="Grille">▦</div>
          <div class="view-btn"   id="vList" onclick="setView('list')" title="Liste">☰</div>
        </div>
      </div>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="listings-grid" id="listingsGrid"></div>
  </main>
</div>


  <script src="./script/config.js"></script>
<script src="./script/admin/translate.js"></script>
<script src="./script/annonces/annonceAll.js"></script>
</body>
</html>
