<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Logistique & Box — ReNova Admin</title>
    <script src="../Frontend/script/auth_guard.js"></script>
    <script>
      checkSession("Administrateur");
    </script>
    <link rel="stylesheet" href="../Frontend/style/admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body
    style="display: flex; min-height: 100vh; margin: 0; background: var(--bg)"
  >
    <aside
      style="
        width: 260px;
        background: var(--bg2);
        border-right: 1px solid var(--b0);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: sticky;
        top: 0;
        height: 100vh;
        flex-shrink: 0;
      "
    >
      <div
        style="
          font-family: &quot;Syne&quot;, sans-serif;
          font-size: 24px;
          font-weight: 800;
          color: white;
          text-align: center;
        "
      >
        ReNova <em style="color: var(--or-l); font-style: normal">Admin</em>
      </div>
      <nav style="display: flex; flex-direction: column; gap: 8px">
        <a href="admin_dashboard.html" class="nav-link"
          ><span class="material-symbols-outlined">dashboard</span> Vue
          d'ensemble</a
        >
        <a href="admin_users.html" class="nav-link"
          ><span class="material-symbols-outlined">group</span> Utilisateurs</a
        >
        <a href="admin_validations.html" class="nav-link"
          ><span class="material-symbols-outlined">check_circle</span>
          Validations</a
        >
        <a href="admin_conteneurs.html" class="nav-link active"
          ><span class="material-symbols-outlined">inventory_2</span> Logistique
          & Box</a
        >
      </nav>
      <button
        class="btn btn-o btn-full"
        style="margin-top: auto"
        onclick="Auth.logout()"
      >
        <span class="material-symbols-outlined">logout</span> Déconnexion
      </button>
    </aside>

    <main style="flex: 1; padding: 40px">
      <div class="hero">
        <h1 class="hero-title">Réseau de <em>Conteneurs</em></h1>
        <p class="hero-desc">
          Gérez les box intelligentes et les codes d'accès.
        </p>
      </div>

      <div
        id="box-stats"
        class="card"
        style="
          margin-bottom: 20px;
          padding: 15px;
          color: var(--or-l);
          font-weight: 600;
        "
      ></div>

      <div id="box-container" class="kpi-grid"></div>
    </main>

    <script src="../Frontend/script/admin/box.js" defer></script>
  </body>
</html>
