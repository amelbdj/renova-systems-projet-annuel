<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Frontend/style/forum.css" />
    <link rel="stylesheet" href="../Frontend/style/client.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <title>Forum</title>
  </head>
  <body>
    <nav class="topnav">
      <div class="nav-logo">
        <img src="../Frontend/assets/logo renova.png" alt="ReNova" />
      </div>
      <div class="nav-links">
        <a class="nav-link active">Accueil</a>
        <a class="nav-link" href="../Frontend/espClient.html">Annonces</a>
        <a class="nav-link" href="../Frontend/espClient.html">Conteneurs</a>
        <a class="nav-link" href="../Frontend/espClient.html">Catalogue</a>
        <a class="nav-link" href="../Frontend/espClient.html">Planning</a>
        <a class="nav-link" href="../Frontend/espClient.html">Mon score</a>
        <a class="nav-link" href="../Frontend/article.html">Article</a>
        <a class="nav-link" href="../Frontend/evenement.html">Evenement</a>
        <a class="nav-link" href="../Frontend/forum.html">Forum</a>
      </div>
      <div class="nav-right">
        <button class="nav-link" onclick="showSection('messages-section')">
          <i class="fas fa-envelope"></i> Mes Messages
        </button>
        <div class="lang-btn">
          <span class="material-symbols-outlined"> public </span>Lang
        </div>
        <div class="nav-icon" onclick="logout()">
          <span class="material-symbols-outlined"> logout </span>
        </div>
        <div class="nav-icon">
          <span class="material-symbols-outlined"> notifications </span>
          <div class="notif-dot"></div>
        </div>
        <div
          class="profile-btn"
          onclick="goToProfile()"
          style="cursor: pointer"
        >
          <div class="profile-ava">👤</div>
          <div>
            <div class="profile-name" id="navName">Your Name</div>
            <div class="profile-role">Particulier</div>
          </div>
        </div>
      </div>
    </nav>

    <div
      class="wrapper"
      id="forum-section"
      class="dashboard-section"
      style="margin-top: 40px; margin-bottom: 60px"
    >
      <div
        class="card"
        style="
          padding: 30px;
          min-height: 600px;
          display: flex;
          flex-direction: column;
        "
      >
        <div id="vue-liste-forums">
          <div class="forum-main-header">
            <h3>Forum d'Entraide</h3>
            <button class="btn btn-p" onclick="ouvrirNouveauSujet()">
              + Nouveau Sujet
            </button>
          </div>
          <div id="liste-sujets-forum" class="forum-container"></div>
        </div>

        <div
          id="vue-sujet-actif"
          style="display: none; flex-direction: column; height: 100%"
        >
          <div class="sujet-actif-header">
            <button class="btn btn-g" onclick="retourListeForums()">
              ← Retour
            </button>
            <h3 id="titre-sujet-actif">Chargement...</h3>
          </div>
          <div
            id="zone-messages"
            style="flex: 1; min-height: 350px; overflow-y: auto"
          ></div>
          <div class="chat-input-wrapper">
            <input
              type="text"
              id="input-nouveau-message"
              placeholder="Écrire une réponse..."
            />
            <button class="btn btn-p" onclick="envoyerMessage()">
              Envoyer
            </button>
          </div>
        </div>
      </div>
    </div>

    <section
      id="messages-section"
      class="dashboard-section"
      style="display: none; padding: 20px"
    >
      <h2>Mes Conversations</h2>
      <div id="conversations-list"></div>
      <div id="no-messages" style="display: none">Aucun message.</div>
    </section>

    <div
      id="chatModal"
      class="modal-overlay"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      "
    >
      <div
        class="modal-content"
        style="
          width: 400px;
          height: 500px;
          display: flex;
          flex-direction: column;
          background: var(--bg);
        "
      >
        <div
          style="padding: 15px; display: flex; justify-content: space-between"
        >
          <h3>Discussion</h3>
          <span onclick="closeChat()" style="cursor: pointer">&times;</span>
        </div>
        <div
          id="chat-messages"
          style="flex: 1; overflow-y: auto; padding: 15px"
        ></div>
        <div style="padding: 15px; display: flex; gap: 10px">
          <input type="text" id="chat-input" placeholder="Message..." />
          <button onclick="sendChatMessage()">Envoyer</button>
        </div>
      </div>
    </div>
    <div
      id="modal-nouveau-sujet"
      class="modal-overlay"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      "
    >
      <div
        class="modal-content"
        style="
          width: 500px;
          max-width: 90vw;
          padding: 25px;
          display: flex;
          flex-direction: column;
          background: var(--bg);
          border-radius: 8px;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h3 style="margin: 0">Créer un nouveau sujet</h3>
          <span
            onclick="fermerModalSujet()"
            style="cursor: pointer; font-size: 24px; font-weight: bold"
            >&times;</span
          >
        </div>

        <div style="display: flex; flex-direction: column; gap: 15px">
          <div>
            <label
              style="
                font-size: 14px;
                color: var(--txt-m);
                margin-bottom: 5px;
                display: block;
              "
              >Titre du sujet</label
            >
            <input
              type="text"
              id="nouveau-sujet-titre"
              placeholder="Ex: Besoin d'aide pour réparer un meuble..."
              style="
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid var(--b0);
                background: var(--bg2);
                color: white;
              "
            />
          </div>
          <div>
            <label
              style="
                font-size: 14px;
                color: var(--txt-m);
                margin-bottom: 5px;
                display: block;
              "
              >Votre premier message</label
            >
            <textarea
              id="nouveau-sujet-message"
              rows="6"
              placeholder="Expliquez votre problème en détail..."
              style="
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid var(--b0);
                background: var(--bg2);
                color: white;
                resize: vertical;
              "
            ></textarea>
          </div>
          <button
            class="btn btn-p"
            onclick="validerNouveauSujet()"
            style="align-self: flex-end; margin-top: 10px"
          >
            Publier le sujet
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="../Frontend/script/forum.js" defer></script>
  <script src="../Frontend/script/profil.js" defer></script>
  <script src="../Frontend/script/messagerie/messagerie.js" defer></script>
</html>
